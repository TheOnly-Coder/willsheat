<body>
  <main>
    <h1>Will's Heat</h1>
    <p>Minecraft server and YouTube.</p>
    <div class="actions">
      <button id="copyBtn" type="button">Copy Server IP</button>
      <a class="btn" href="#" onclick="(function(e){e.preventDefault();if(Math.random()<0.3){window.open('https://omg10.com/4/11703991','_blank')}else{window.open('https://www.youtube.com/@HotWillNotElaborate','_blank')}})(event)">YouTube</a>
    </div>
    <p class="ip-display">play.willsheat.org</p>
  </main>

  <script>
    document.getElementById('copyBtn').addEventListener('click', function() {
      var ip = 'play.willsheat.org';
      var btn = this;
      var original = btn.textContent;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ip).then(function() {
          btn.textContent = 'Copied';
          setTimeout(function() { btn.textContent = original; }, 1500);
        });
      } else {
        var ta = document.createElement('textarea');
        ta.value = ip;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); btn.textContent = 'Copied'; setTimeout(function() { btn.textContent = original; }, 1500); } catch(e) {}
        document.body.removeChild(ta);
      }
    });
  </script>
